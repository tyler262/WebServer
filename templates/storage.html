{% extends "base.html" %}

{% block title %}Storage — Dashboard{% endblock %}

{% block header_title %}&#128230; Storage{% endblock %}

{% block content %}
  <main class="settings-main" style="max-width:900px">

    <!-- Search -->
    <div class="card">
      <div class="card-title">&#128269; Find an Item</div>
      <div class="input-row" style="margin-bottom:0">
        <input type="text" id="page-search-input" placeholder="Search items across all locations&hellip;" maxlength="200" autocomplete="off" oninput="pageSearch(this.value)">
      </div>
      <div id="page-search-results" style="margin-top:.5rem"></div>
    </div>

    <!-- Locations -->
    <div id="locations-container"></div>

    <!-- Add location -->
    <div class="card">
      <div class="card-title">&#43; New Location</div>
      <div class="input-row" style="margin-bottom:0">
        <input type="text" id="new-loc-name" placeholder="Location name (e.g. Above Garage, Hall Closet)&hellip;" maxlength="200" autocomplete="off" onkeydown="if(event.key==='Enter')addLocation()">
        <button class="btn-submit" onclick="addLocation()">Add Location</button>
      </div>
      <div id="new-loc-status" class="settings-status"></div>
    </div>

  </main>
{% endblock %}

{% block scripts %}
<script src="/static/storage.js"></script>
{% endblock %}
